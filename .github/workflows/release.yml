# Creates the GitHub release whenever a v* tag is pushed.
# The tag annotation IS the release notes - write them in the tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Extract tag notes
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "uiforagents $GITHUB_REF_NAME" --notes-file release-notes.md
