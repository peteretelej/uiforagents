iv>\n\n<\/section>\n<section class=\"arena-item\"><h3>toast<\/h3>\n\n  <div class=\"uif-toast-region\">\n    <div class=\"uif-toast\" data-variant=\"info\" data-state=\"visible\" role=\"status\">\n      <span data-slot=\"message\">Draft saved<\/span>\n      <button type=\"button\" data-slot=\"close\">Dismiss<\/button>\n    <\/div>\n  <\/div>\n  <button type=\"button\" class=\"uif-toast-trigger\" data-slot=\"trigger\">Show toast<\/button>\n  <script>\n// Dependency-free show/hide. The script scopes queries to its own markup; no ids.\nconst region = document.querySelector(\".uif-toast-region\");\nconst toast = region.querySelector(\".uif-toast\");\nconst trigger = document.querySelector(\"[data-slot='trigger']\");\nconst close = toast.querySelector(\"[data-slot='close']\");\n\nlet timer;\ntrigger.addEventListener(\"click\", () => {\n  clearTimeout(timer);\n  toast.dataset.state = \"visible\";\n  timer = setTimeout(() => {\n    toast.dataset.state = \"hidden\";\n  }, 4000);\n});\n\nclose.addEventListener(\"click\", () => {\n  clearTimeout(timer);\n  toast.dataset.state = \"hidden\";\n});\n<\/script>\n\n<\/section>\n<section class=\"arena-item\"><h3>toggle<\/h3>\n\n  <label class=\"uif-toggle\">\n    <input class=\"uif-toggle-input\" type=\"checkbox\" role=\"switch\">\n    <span data-slot=\"label\">Email notifications<\/span>\n  <\/label>\n  <label class=\"uif-toggle\">\n    <input class=\"uif-toggle-input\" type=\"checkbox\" role=\"switch\" checked>\n    <span data-slot=\"label\">Compact mode<\/span>\n  <\/label>\n  <label class=\"uif-toggle\">\n    <input class=\"uif-toggle-input\" type=\"checkbox\" role=\"switch\" disabled>\n    <span data-slot=\"label\">Legacy export<\/span>\n  <\/label>\n\n<\/section>\n<section class=\"arena-item\"><h3>top-nav<\/h3>\n\n  <header class=\"uif-top-nav\">\n    <a data-slot=\"wordmark\" href=\"#\">Acme<\/a>\n    <nav data-slot=\"links\" aria-label=\"Main\">\n      <a href=\"#\" aria-current=\"page\">Overview<\/a>\n      <a href=\"#\">Projects<\/a>\n      <a href=\"#\">Reports<\/a>\n      <a href=\"#\">Settings<\/a>\n    <\/nav>\n    <div data-slot=\"actions\">\n      <a href=\"#\">Sign out<\/a>\n    <\/div>\n  <\/header>\n\n<\/section>\n<\/body>\n<\/html>"},{"slug":"graphite","name":"Graphite","mood":"technical","notes":"Dark-first charcoal, cool gray, electric lime accent. Dense and flat.","html":"<!doctype html>\n<html lang=\"en\" data-theme=\"graphite\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\n:root,\n[data-theme=\"paper\"] {\n  --bg: oklch(98% 0.005 85);\n  --surface: oklch(100% 0 0);\n  --border: oklch(90% 0.01 85);\n  --text: oklch(24% 0.01 75);\n  --text-muted: oklch(46% 0.015 75);\n  --faint: oklch(78% 0.008 80);\n  --accent: oklch(48% 0.13 55);\n  --accent-soft: oklch(95% 0.025 60);\n  --accent-fg: oklch(99% 0.005 85);\n  --ok: oklch(46% 0.11 155);\n  --ok-soft: oklch(95% 0.03 155);\n  --ok-fg: oklch(99% 0.005 155);\n  --warn: oklch(46% 0.1 70);\n  --warn-soft: oklch(96% 0.035 85);\n  --warn-fg: oklch(99% 0.005 85);\n  --danger: oklch(52% 0.17 30);\n  --danger-soft: oklch(95% 0.03 30);\n  --danger-fg: oklch(99% 0.005 30);\n  --scrim: oklch(24% 0.01 75 / 0.45);\n  --radius: 8px;\n  --shadow-char: 0 1px 2px oklch(24% 0.01 75 / 0.08), 0 4px 12px oklch(24% 0.01 75 / 0.06);\n  --font-display: Georgia, 'Times New Roman', serif;\n  --font-body: system-ui, sans-serif;\n  --space: 8px;\n  --text-base: 16px;\n  color-scheme: light;\n}\n[data-theme=\"graphite\"] {\n  --bg: oklch(19% 0.005 260);\n  --surface: oklch(23% 0.007 260);\n  --border: oklch(32% 0.008 260);\n  --text: oklch(94% 0.003 260);\n  --text-muted: oklch(72% 0.006 260);\n  --faint: oklch(40% 0.006 260);\n  --accent: oklch(84% 0.17 110);\n  --accent-soft: oklch(84% 0.17 110 / 0.18);\n  --accent-fg: oklch(22% 0.02 110);\n  --ok: oklch(78% 0.14 155);\n  --ok-soft: oklch(78% 0.14 155 / 0.18);\n  --ok-fg: oklch(20% 0.02 155);\n  --warn: oklch(80% 0.14 85);\n  --warn-soft: oklch(80% 0.14 85 / 0.18);\n  --warn-fg: oklch(22% 0.02 85);\n  --danger: oklch(70% 0.18 25);\n  --danger-soft: oklch(70% 0.18 25 / 0.18);\n  --danger-fg: oklch(20% 0.02 25);\n  --scrim: oklch(10% 0.005 260 / 0.6);\n  --radius: 4px;\n  --shadow-char: 0 1px 2px oklch(0% 0 0 / 0.4);\n  --font-display: ui-monospace, Menlo, Consolas, monospace;\n  --font-body: system-ui, sans-serif;\n  --space: 8px;\n  --text-base: 16px;\n  color-scheme: dark;\n}\n[data-theme=\"citrus\"] {\n  --bg: oklch(97% 0.02 100);\n  --surface: oklch(99.5% 0.01 105);\n  --border: oklch(88% 0.02 100);\n  --text: oklch(22% 0.01 110);\n  --text-muted: oklch(44% 0.015 110);\n  --faint: oklch(80% 0.015 105);\n  --accent: oklch(58% 0.16 60);\n  --accent-soft: oklch(93% 0.055 70);\n  --accent-fg: oklch(22% 0.02 100);\n  --ok: oklch(50% 0.12 150);\n  --ok-soft: oklch(94% 0.04 150);\n  --ok-fg: oklch(99% 0.005 150);\n  --warn: oklch(46% 0.1 70);\n  --warn-soft: oklch(95% 0.045 85);\n  --warn-fg: oklch(99% 0.005 85);\n  --danger: oklch(52% 0.18 28);\n  --danger-soft: oklch(94% 0.035 28);\n  --danger-fg: oklch(99% 0.005 28);\n  --scrim: oklch(22% 0.01 110 / 0.45);\n  --radius: 16px;\n  --shadow-char: 0 2px 0 oklch(22% 0.01 110);\n  --font-display: system-ui, sans-serif;\n  --font-body: system-ui, sans-serif;\n  --space: 8px;\n  --text-base: 16px;\n  color-scheme: light;\n}\n<\/style>\n<style>.uif-player {\n  display: flex;\n  align-items: center;\n  gap: calc(var(--space) * 2.5);\n  width: 100%;\n  max-width: 480px;\n  box-sizing: border-box;\n  padding: calc(var(--space) * 2) calc(var(--space) * 3);\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-char);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.875);\n}\n\n.uif-player [data-slot=\"play\"] {\n  flex-shrink: 0;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  /* 44px minimum touch target */\n  width: max(44px, calc(var(--space) * 5.5));\n  height: max(44px, calc(var(--space) * 5.5));\n  border: 0;\n  border-radius: calc(var(--radius) * 10);\n  background: var(--accent);\n  color: var(--accent-fg);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.75);\n  cursor: pointer;\n}\n\n.uif-player [data-slot=\"play\"]:hover {\n  background: color-mix(in oklch, var(--accent), var(--text) 12%);\n}\n\n.uif-player [data-slot=\"play\"]:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n.uif-player [data-slot=\"meta\"] {\n  display: grid;\n  gap: calc(var(--space) * 0.5);\n  min-width: 0;\n}\n\n.uif-player [data-slot=\"title\"] {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-weight: 600;\n}\n\n.uif-player [data-slot=\"time\"] {\n  color: var(--text-muted);\n  font-size: calc(var(--text-base) * 0.75);\n  font-variant-numeric: tabular-nums;\n}\n\n.uif-player [data-slot=\"progress\"] {\n  flex: 1;\n  height: calc(var(--space) * 1);\n  border-radius: calc(var(--radius) * 10);\n  background: var(--border);\n  overflow: hidden;\n}\n\n.uif-player [data-slot=\"progress-fill\"] {\n  display: block;\n  height: 100%;\n  background: var(--accent);\n}\n\n.uif-badge {\n  display: inline-flex;\n  align-items: center;\n  padding: calc(var(--space) * 0.25) calc(var(--space) * 1.5);\n  border-radius: calc(var(--radius) * 10);\n  background: var(--accent-soft);\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.75);\n  font-weight: 600;\n  line-height: 1.6;\n}\n\n.uif-badge[data-variant=\"ok\"] {\n  background: var(--ok-soft);\n  color: var(--ok);\n}\n\n.uif-badge[data-variant=\"warn\"] {\n  background: var(--warn-soft);\n  color: var(--warn);\n}\n\n.uif-badge[data-variant=\"danger\"] {\n  background: var(--danger-soft);\n  color: var(--danger);\n}\n\n.uif-badge[data-variant=\"muted\"] {\n  background: transparent;\n  border: 1px solid var(--border);\n  color: var(--text-muted);\n}\n\n.uif-button {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: calc(var(--space) * 1);\n  padding: 0 calc(var(--space) * 3);\n  /* 44px minimum touch target */\n  min-height: max(44px, calc(var(--space) * 5.5));\n  border: 1px solid transparent;\n  border-radius: var(--radius);\n  background: var(--accent);\n  color: var(--accent-fg);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.875);\n  font-weight: 600;\n  line-height: 1;\n  white-space: nowrap;\n  cursor: pointer;\n  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;\n}\n\n.uif-button:hover {\n  background: color-mix(in oklch, var(--accent), var(--text) 12%);\n}\n\n.uif-button:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n.uif-button[data-variant=\"secondary\"] {\n  background: var(--surface);\n  border-color: var(--border);\n  color: var(--text);\n}\n\n.uif-button[data-variant=\"secondary\"]:hover {\n  background: color-mix(in oklch, var(--surface), var(--text) 6%);\n}\n\n.uif-button[data-variant=\"danger\"] {\n  background: var(--danger);\n  color: var(--danger-fg);\n}\n\n.uif-button[data-variant=\"danger\"]:hover {\n  background: color-mix(in oklch, var(--danger), var(--text) 12%);\n}\n\n.uif-button[data-variant=\"small\"] {\n  padding: 0 calc(var(--space) * 2);\n  font-size: calc(var(--text-base) * 0.8125);\n}\n\n.uif-button:disabled {\n  background: var(--faint);\n  border-color: var(--faint);\n  color: var(--bg);\n  cursor: not-allowed;\n}\n\n.uif-card {\n  display: block;\n  padding: calc(var(--space) * 3);\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-char);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: var(--text-base);\n}\n\n.uif-card [data-slot=\"title\"] {\n  margin: 0 0 calc(var(--space) * 1.5);\n  font-family: var(--font-display);\n  font-size: calc(var(--text-base) * 1.125);\n  font-weight: 600;\n  line-height: 1.3;\n}\n\n.uif-card [data-slot=\"body\"] {\n  margin: 0 0 calc(var(--space) * 2);\n  color: var(--text-muted);\n  line-height: 1.5;\n}\n\n.uif-card [data-slot=\"body\"]:last-child {\n  margin-bottom: 0;\n}\n\n.uif-card [data-slot=\"actions\"] {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: calc(var(--space) * 2);\n}\n\n.uif-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: calc(var(--space) * 1);\n  padding: calc(var(--space) * 0.375) calc(var(--space) * 2);\n  border: 1px solid var(--border);\n  border-radius: calc(var(--radius) * 10);\n  background: var(--surface);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.8125);\n  font-weight: 500;\n  line-height: 1.4;\n}\n\n.uif-chip[data-variant=\"accent\"] {\n  background: var(--accent-soft);\n  border-color: transparent;\n  color: var(--accent);\n}\n\n.uif-chip[data-variant=\"warn\"] {\n  background: var(--warn-soft);\n  border-color: transparent;\n  color: var(--warn);\n}\n\n.uif-table {\n  border-collapse: separate;\n  border-spacing: 0;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  overflow: hidden;\n  color: var(--text);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.875);\n}\n\n.uif-table th {\n  padding: calc(var(--space) * 2) calc(var(--space) * 3);\n  border-bottom: 1px solid var(--border);\n  color: var(--text-muted);\n  font-size: calc(var(--text-base) * 0.8125);\n  font-weight: 600;\n  text-align: left;\n}\n\n.uif-table td {\n  padding: calc(var(--space) * 2) calc(var(--space) * 3);\n  border-bottom: 1px solid var(--border);\n}\n\n.uif-table tbody tr:last-child td {\n  border-bottom: 0;\n}\n\n.uif-table th button {\n  display: inline-flex;\n  align-items: center;\n  padding: 0;\n  border: 0;\n  background: none;\n  color: inherit;\n  font: inherit; ase) * 0.875);\n}\n\n.uif-player [data-slot=\"play\"] {\n  flex-shrink: 0;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  /* 44px minimum touch target */\n  width: max(44px, calc(var(--space) * 5.5));\n  height: max(44px, calc(var(--space) * 5.5));\n  border: 0;\n  border-radius: calc(var(--radius) * 10);\n  background: var(--accent);\n  color: var(--accent-fg);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.75);\n  cursor: pointer;\n}\n\n.uif-player [data-slot=\"play\"]:hover {\n  background: color-mix(in oklch, var(--accent), var(--text) 12%);\n}\n\n.uif-player [data-slot=\"play\"]:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n\n.uif-player [data-slot=\"meta\"] {\n  display: grid;\n  gap: calc(var(--space) * 0.5);\n  min-width: 0;\n}\n\n.uif-player [data-slot=\"title\"] {\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n  font-weight: 600;\n}\n\n.uif-player [data-slot=\"time\"] {\n  color: var(--text-muted);\n  font-size: calc(var(--text-base) * 0.75);\n  font-variant-numeric: tabular-nums;\n}\n\n.uif-player [data-slot=\"progress\"] {\n  flex: 1;\n  height: calc(var(--space) * 1);\n  border-radius: calc(var(--radius) * 10);\n  background: var(--border);\n  overflow: hidden;\n}\n\n.uif-player [data-slot=\"progress-fill\"] {\n  display: block;\n  height: 100%;\n  background: var(--accent);\n}\n\n.uif-badge {\n  display: inline-flex;\n  align-items: center;\n  padding: calc(var(--space) * 0.25) calc(var(--space) * 1.5);\n  border-radius: calc(var(--radius) * 10);\n  background: var(--accent-soft);\n  color: var(--accent);\n  font-family: var(--font-body);\n  font-size: calc(var(--text-base) * 0.75);\n  font-weight: 600;\n  line-height: 1.6;\n}\n\n.uif-badge[data-variant=\"ok\"] {\n  background: var(--ok-soft);\n  color: var(--ok);\n}\n\n.uif-badge[data-variant=\"warn\"] {\n  background: var(--warn-soft);\n  color: var(--warn);\n}\n\n.uif-badge[data- en].indexOf(th);\n      const descending = th.getAttribute(\"aria-sort\") === \"ascending\";\n\n      table.querySelectorAll(\"th\").forEach((other) => other.removeAttribute(\"aria-sort\"));\n      th.setAttribute(\"aria-sort\", descending ? \"descending\" : \"ascending\");\n\n      const rows = [...tbody.querySelectorAll(\"tr\")];\n      rows.sort((a, b) => {\n        const av = a.children[index].textContent.trim();\n        const bv = b.children[index].textContent.trim();\n        const cmp = av.localeCompare(bv, undefined, { numeric: true });\n        return descending ? -cmp : cmp;\n      });\n      rows.forEach((row) => tbody.append(row));\n    });\n  });\n\n  const all = table.querySelector(\"th input[type='checkbox']\");\n  if (all) {\n    all.addEventListener(\"change\", () => {\n      table.querySelectorAll(\"tbody input[type='checkbox']\").forEach((box) => {\n        box.checked = all.checked;\n      });\n    });\n  }\n});\n<\/script>\n\n<\/section>\n<section class=\"arena-item\"><h3>dead-states<\/h3>\n\n  <section class=\"uif-dead\" data-variant=\"not-found\">\n    <h2 data-slot=\"title\">Page not found<\/h2>\n    <p data-slot=\"body\">The page you are looking for does not exist or has moved. Check the address, or head back home.<\/p>\n    <a data-slot=\"action\" href=\"#\">Back home<\/a>\n  <\/section>\n  <section class=\"uif-dead\" data-variant=\"deleted\">\n    <h2 data-slot=\"title\">This project was deleted<\/h2>\n    <p data-slot=\"body\">The owner removed this project and its contents. You can restore it from trash within 30 days.<\/p>\n    <a data-slot=\"action\" href=\"#\">Open trash<\/a>\n  <\/section>\n  <section class=\"uif-dead\" data-variant=\"expired\">\n    <h2 data-slot=\"title\">This link has expired<\/h2>\n    <p data-slot=\"body\">Sharing links stay active for 7 days. Ask the owner for a fresh link to continue.<\/p>\n    <a data-slot=\"action\" href=\"#\">Request access<\/a>\n  <\/section>\n  <section class=\"uif-dead\" data-variant=\" <script>
  const payload = JSON.parse(document.getElementById("arena-payload").textContent);
  const main = document.getElementById("frames");
  for (const page of payload.pages) {
    const section = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = page.name + " · " + page.slug + " · " + page.mood;
    const frame = document.createElement("iframe");
    frame.title = page.name + " direction";
    frame.addEventListener("load", () => {
      try { frame.style.height = frame.contentDocument.documentElement.scrollHeight + "px"; } catch (err) {}
    });
    frame.srcdoc = page.html;
    section.append(h2, frame);
    main.append(section);
  }
</script>
