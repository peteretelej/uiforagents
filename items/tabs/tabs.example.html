<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="tabs.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--space) * 4);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: var(--text-base);
      display: grid;
      gap: calc(var(--space) * 4);
      justify-items: stretch;
    }
  </style>
</head>
<body>
  <div class="uif-tabs">
    <div class="uif-tabs-list">
      <label class="uif-tab">
        <input type="radio" name="tabs-underline" value="preview" checked>
        <span data-slot="tab">Preview</span>
      </label>
      <label class="uif-tab">
        <input type="radio" name="tabs-underline" value="history">
        <span data-slot="tab">History</span>
      </label>
    </div>
    <div class="uif-tabs-panel" data-panel="preview">Preview shows the rendered result of the current draft.</div>
    <div class="uif-tabs-panel" data-panel="history" hidden>History lists every saved revision with timestamps.</div>
  </div>
  <div class="uif-tabs" data-variant="pill">
    <div class="uif-tabs-list">
      <label class="uif-tab">
        <input type="radio" name="tabs-pill" value="preview" checked>
        <span data-slot="tab">Preview</span>
      </label>
      <label class="uif-tab">
        <input type="radio" name="tabs-pill" value="history">
        <span data-slot="tab">History</span>
      </label>
    </div>
    <div class="uif-tabs-panel" data-panel="preview">The pill style reads softer; the direction picks per project.</div>
    <div class="uif-tabs-panel" data-panel="history" hidden>Same panels, different tab chrome.</div>
  </div>
</body>
</html>
