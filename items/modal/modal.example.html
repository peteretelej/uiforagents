<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modal · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="modal.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: start;
    }
  </style>
</head>
<body>
  <button type="button" class="uifa-modal-trigger" data-uifa-slot="open">Delete project</button>
  <dialog class="uifa-modal" open aria-label="Delete project">
    <h2 data-uifa-slot="title">Delete project?</h2>
    <p data-uifa-slot="body">This permanently removes the project and all of its data. This action cannot be undone.</p>
    <div data-uifa-slot="actions">
      <button type="button" class="uifa-modal-action" data-uifa-variant="secondary" data-uifa-slot="cancel">Cancel</button>
      <button type="button" class="uifa-modal-action" data-uifa-variant="danger" data-uifa-slot="confirm">Delete</button>
    </div>
  </dialog>
  <script src="modal.js"></script>
</body>
</html>
