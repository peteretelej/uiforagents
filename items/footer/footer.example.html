<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Footer · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="footer.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
    }
  </style>
</head>
<body>
  <footer class="uifa-footer">
    <div data-uifa-slot="brand">
      <a data-uifa-slot="wordmark" href="/">Acme</a>
      <p data-uifa-slot="note">Recording studio for distributed teams.</p>
    </div>
    <nav data-uifa-slot="group" aria-label="Product">
      <span data-uifa-slot="heading">Product</span>
      <a data-uifa-slot="link" href="#">Episodes</a>
      <a data-uifa-slot="link" href="#">Pricing</a>
      <a data-uifa-slot="link" href="#">Support</a>
    </nav>
    <nav data-uifa-slot="group" aria-label="Company">
      <span data-uifa-slot="heading">Company</span>
      <a data-uifa-slot="link" href="#">About</a>
      <a data-uifa-slot="link" href="#">Careers</a>
      <a data-uifa-slot="link" href="#">Contact</a>
    </nav>
    <p data-uifa-slot="legal">© 2026 Acme Inc. All rights reserved.</p>
  </footer>
  <footer class="uifa-footer" data-uifa-variant="simple">
    <a data-uifa-slot="wordmark" href="/">Acme</a>
    <p data-uifa-slot="legal">© 2026 Acme Inc. All rights reserved.</p>
  </footer>
</body>
</html>
