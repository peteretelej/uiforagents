<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sidebar · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="sidebar.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: start;
    }
    .uifa-sidebar { min-width: 240px; }
  </style>
</head>
<body>
  <nav class="uifa-sidebar" data-uifa-variant="panel" aria-label="Sections">
    <a data-uifa-slot="link" href="#" aria-current="page">Overview</a>
    <a data-uifa-slot="link" href="#">Episodes</a>
    <div data-uifa-slot="group">
      <span data-uifa-slot="heading">Library</span>
      <a data-uifa-slot="link" href="#">Clips</a>
      <a data-uifa-slot="link" href="#">Assets</a>
    </div>
  </nav>
  <nav class="uifa-sidebar" data-uifa-variant="flat" aria-label="Library sections">
    <a data-uifa-slot="link" href="#" aria-current="page">Season 4</a>
    <a data-uifa-slot="link" href="#">Season 3</a>
    <a data-uifa-slot="link" href="#">Season 2</a>
  </nav>
</body>
</html>
