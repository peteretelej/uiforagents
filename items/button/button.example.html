<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="button.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: start;
    }
  </style>
</head>
<body>
  <button class="uifa-button" data-uifa-variant="primary">Save changes</button>
  <button class="uifa-button" data-uifa-variant="secondary">Preview</button>
  <button class="uifa-button" data-uifa-variant="danger">Delete project</button>
  <button class="uifa-button" data-uifa-variant="small">Compact action</button>
  <button class="uifa-button" data-uifa-variant="primary" disabled>Saved</button>
</body>
</html>
