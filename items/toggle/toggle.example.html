<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toggle switch · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="toggle.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: start;
    }
  </style>
</head>
<body>
  <label class="uifa-toggle">
    <input class="uifa-toggle-input" type="checkbox" role="switch">
    <span data-uifa-slot="label">Email notifications</span>
  </label>
  <label class="uifa-toggle">
    <input class="uifa-toggle-input" type="checkbox" role="switch" checked>
    <span data-uifa-slot="label">Compact mode</span>
  </label>
  <label class="uifa-toggle">
    <input class="uifa-toggle-input" type="checkbox" role="switch" disabled>
    <span data-uifa-slot="label">Legacy export</span>
  </label>
</body>
</html>
