<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top nav · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="top-nav.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: stretch;
    }
  </style>
</head>
<body>
  <header class="uifa-top-nav">
    <a data-uifa-slot="wordmark" href="#">Acme</a>
    <nav data-uifa-slot="links" aria-label="Main">
      <a href="#" aria-current="page">Overview</a>
      <a href="#">Projects</a>
      <a href="#">Reports</a>
      <a href="#">Settings</a>
    </nav>
    <div data-uifa-slot="actions">
      <a href="#">Sign out</a>
    </div>
  </header>
</body>
</html>
