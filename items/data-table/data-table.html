<!-- Sortable headers: th[aria-sort] + button. Selection: native checkboxes.
     Empty state: a table with data-state="empty" and one empty row. -->
<table class="uifa-table" data-sortable>
  <thead>
    <tr>
      <th><input data-uifa-slot="select" type="checkbox" aria-label="Select all rows"></th>
      <th aria-sort="ascending"><button type="button">Name</button></th>
      <th>Status</th>
      <th><button type="button">Updated</button></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td><input data-uifa-slot="select" type="checkbox" aria-label="Select row"></td>
      <td>Cell</td>
      <td><span data-uifa-slot="status">Active</span></td>
      <td>2026-01-01</td>
    </tr>
  </tbody>
</table>
<table class="uifa-table" data-state="empty">
  <tbody>
    <tr>
      <td data-uifa-slot="empty" colspan="4">Nothing to show</td>
    </tr>
  </tbody>
</table>
