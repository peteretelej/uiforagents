<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data table · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="data-table.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: stretch;
    }
  </style>
</head>
<body>
  <table class="uifa-table" data-sortable>
    <thead>
      <tr>
        <th><input class="uifa-select" data-uifa-slot="select" type="checkbox" aria-label="Select all rows"></th>
        <th aria-sort="ascending"><button type="button">Name</button></th>
        <th>Status</th>
        <th><button type="button">Updated</button></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input data-uifa-slot="select" type="checkbox" aria-label="Select Atlas"></td>
        <td>Atlas</td>
        <td><span data-uifa-slot="status">Active</span></td>
        <td>2026-09-21</td>
      </tr>
      <tr>
        <td><input data-uifa-slot="select" type="checkbox" aria-label="Select Beacon"></td>
        <td>Beacon</td>
        <td><span data-uifa-slot="status" data-uifa-variant="warn">Due soon</span></td>
        <td>2026-09-24</td>
      </tr>
      <tr>
        <td><input data-uifa-slot="select" type="checkbox" aria-label="Select Compass"></td>
        <td>Compass</td>
        <td><span data-uifa-slot="status" data-uifa-variant="danger">Expired</span></td>
        <td>2026-09-12</td>
      </tr>
    </tbody>
  </table>
  <table class="uifa-table" data-state="empty">
    <tbody>
      <tr>
        <td data-uifa-slot="empty" colspan="4">No issues match the current filters</td>
      </tr>
    </tbody>
  </table>
  <script src="data-table.js"></script>
</body>
</html>
