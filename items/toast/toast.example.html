<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toast · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="toast.css">
  <script type="importmap">
  {
    "imports": {
      "@zag-js/toast": "https://esm.sh/@zag-js/toast@1.44.0",
      "@zag-js/core": "https://esm.sh/@zag-js/core@1.44.0"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: start;
    }
  </style>
</head>
<body>
  <div class="uifa-toast-region">
    <div class="uifa-toast" data-uifa-variant="info" data-state="visible" role="status">
      <span data-uifa-slot="message">Draft saved</span>
      <button type="button" data-uifa-slot="close">Dismiss</button>
    </div>
  </div>
  <button type="button" class="uifa-toast-trigger" data-uifa-slot="trigger">Show toast</button>
  <script type="module" src="toast.js"></script>
</body>
</html>
