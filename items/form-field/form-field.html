<!-- Wrapping label binds the visible label to the control without ids. -->
<label class="uifa-field">
  <span data-uifa-slot="label">Label</span>
  <input class="uifa-field-input" type="text" name="field" placeholder="Placeholder">
</label>
<label class="uifa-field">
  <span data-uifa-slot="label">Label</span>
  <textarea class="uifa-field-input" data-uifa-variant="textarea" name="field" rows="4"></textarea>
</label>
