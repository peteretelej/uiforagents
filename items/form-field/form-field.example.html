<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form field · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="form-field.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: stretch;
    }
  </style>
</head>
<body>
  <label class="uifa-field">
    <span data-uifa-slot="label">Project name</span>
    <input class="uifa-field-input" type="text" name="project" placeholder="Acme Inc">
  </label>
  <label class="uifa-field">
    <span data-uifa-slot="label">Locked field</span>
    <input class="uifa-field-input" type="text" name="locked" placeholder="Unavailable while synced" disabled>
  </label>
  <label class="uifa-field">
    <span data-uifa-slot="label">Description</span>
    <textarea class="uifa-field-input" data-uifa-variant="textarea" name="description" rows="4" placeholder="What is this project for?"></textarea>
  </label>
</body>
</html>
