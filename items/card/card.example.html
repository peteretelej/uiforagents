<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="card.css">
  <link rel="stylesheet" href="../button/button.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--uifa-space) * 4);
      background: var(--uifa-bg);
      color: var(--uifa-text);
      font-family: var(--uifa-font-body);
      font-size: var(--uifa-text-base);
      display: grid;
      gap: calc(var(--uifa-space) * 3);
      justify-items: start;
    }
  </style>
</head>
<body>
  <article class="uifa-card">
    <h3 data-uifa-slot="title">Usage summary</h3>
    <p data-uifa-slot="body">Your workspace used 42% of its monthly quota. Upgrade any time; usage resets on the first of the month.</p>
    <div data-uifa-slot="actions">
      <button class="uifa-button" data-uifa-variant="primary">View usage</button>
    </div>
  </article>
</body>
</html>
