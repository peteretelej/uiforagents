<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card · uiforagents example</title>
  <link rel="stylesheet" href="../../themes/tokens.css">
  <link rel="stylesheet" href="card.css">
  <link rel="stylesheet" href="../button/button.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: calc(var(--space) * 4);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: var(--text-base);
      display: grid;
      gap: calc(var(--space) * 3);
      justify-items: start;
    }
  </style>
</head>
<body>
  <article class="uif-card">
    <h3 data-slot="title">Usage summary</h3>
    <p data-slot="body">Your workspace used 42% of its monthly quota. Upgrade any time; usage resets on the first of the month.</p>
    <div data-slot="actions">
      <button class="uif-button" data-variant="primary">View usage</button>
    </div>
  </article>
</body>
</html>
